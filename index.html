<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Linksite de TekoLyo</title>

<meta name="description" content="Les liens de TekoLyo">

<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

<style>
@font-face{
  font-family: 'Teko';
  src: url('Teko-Regular.ttf') format('truetype');
  font-weight: normal;
  font-style: normal;
}
body{
  font-family: Teko;
  margin:0;
  display:flex;
  justify-content:center;
  align-items:flex-start;
  min-height:100vh;
  background:linear-gradient(to right,#E35238,#FEDC01);
  color:white;
  text-align:center;
  padding-top:40px;
}

.card{
  background: rgba(255,255,255,0.15);
  padding:40px;
  border-radius:25px;
  backdrop-filter:blur(12px);
  -webkit-backdrop-filter:blur(12px);
  box-shadow:0 10px 30px rgba(0,0,0,0.2);
  display:flex;
  flex-direction:column;
  align-items:center;
  gap:20px;
  max-width:1000px;
  width:90%;
}

.profile{
  width:180px;
  height:180px;
  border-radius:50%;
  border:5px solid white;
  margin-bottom:10px;
  transition: transform 0.3s ease;
}

.profile:hover{
  transform:scale(1.05) rotate(2deg);
}

h1{
  margin:0;
  font-size:2em;
}

p{
  opacity:0.95;
  margin-top:-5px;
  margin-bottom:10px;
  font-size:1.8em;
}

.links-container{
  display:flex;
  flex-wrap:wrap;
  gap:20px;
  justify-content:center;
  width:100%;
}

.link{
  display:flex;
  align-items:center;
  justify-content:center;
  flex-direction:column;
  gap:12px;
  padding:0;
  border-radius:12px;
  color:white;
  font-weight:bold;
  text-decoration:none;
  font-size:16px;
  border:2px solid white;
  transition:all 0.25s ease;
  box-sizing:border-box;
  position:relative;
  overflow:hidden;
}

.link i{
  font-size:20px;
}

.link span{
  text-align:center;
}

.link:hover{
  transform:scale(1.05) translateY(-3px);
  box-shadow:0 10px 25px rgba(0,0,0,0.35);
}

/* effet lumière */
.link::after{
  content:"";
  position:absolute;
  top:0;
  left:-100%;
  width:100%;
  height:100%;
  background:linear-gradient(120deg,transparent,rgba(255,255,255,0.4),transparent);
  transition:0.5s;
}

.link:hover::after{
  left:100%;
}

/* couleurs */
.youtube{background:#FF0000;}
.tiktok{background:#000000;}
.twitch{background:#9146FF;}
.instagram{background:linear-gradient(45deg,#feda75,#d62976,#962fbf);}
.discord{background:#5865F2;}
.blog{background:#ff7a18;}
.github{background:#24292e;}

/* PC */
@media (min-width:700px){

  p{
    font-size:2em;
  }

  .link{
    width:200px;
    min-height:200px;
    flex-direction:column;
    justify-content:center;
    align-items:center;
    font-size:26px;
  }

  .link i{
    font-size:80px;
  }

  .link span{
    font-size:24px;
    text-align:center;
  }

}

/* MOBILE */
@media (max-width:699px){

  .links-container{
    flex-direction:column;
    align-items:stretch;
    width:100%;
  }

  .link{
    width:100%;
    font-size:1.2em;
    padding:12px 15px;
    flex-direction:row;
    justify-content:center;
    gap:10px;
  }

  .link i{
    font-size:20px;
  }

}
</style>
</head>

<body>

<div class="card">

<img src="logo.png" class="profile" alt="Logo de TekoLyo">

<h1>TekoLyo</h1>
<p>Petit créateur de contenu</p>

<div class="links-container">

<a class="link youtube" href="https://www.youtube.com/@TekoLyo" target="_blank" rel="noopener noreferrer">
<i class="fab fa-youtube"></i>
<span>YouTube</span>
</a>

<a class="link tiktok" href="https://tiktok.com/@tekolyo" target="_blank" rel="noopener noreferrer">
<i class="fab fa-tiktok"></i>
<span>TikTok</span>
</a>

<a class="link twitch" href="https://twitch.tv/tekolyo" target="_blank" rel="noopener noreferrer">
<i class="fab fa-twitch"></i>
<span>Twitch</span>
</a>

<a class="link instagram" href="https://instagram.com/tekolyo" target="_blank" rel="noopener noreferrer">
<i class="fab fa-instagram"></i>
<span>Instagram</span>
</a>

<a class="link discord" href="https://discord.gg/AYFfKHQdDA" target="_blank" rel="noopener noreferrer">
<i class="fab fa-discord"></i>
<span>Discord</span>
</a>
  
</div>
</div>

<script>
const konamiCode = [
"ArrowUp","ArrowUp",
"ArrowDown","ArrowDown",
"ArrowLeft","ArrowRight",
"ArrowLeft","ArrowRight",
"b","a"
];

let konamiPosition = 0;

document.addEventListener("keydown", function(e){

  const key = e.key;

  if(key.toLowerCase() === konamiCode[konamiPosition].toLowerCase()){

    konamiPosition++;

    if(konamiPosition === konamiCode.length){

      window.location.href="https://www.youtube.com/watch?v=dQw4w9WgXcQ";

      konamiPosition = 0;

    }

  } else {

    konamiPosition = 0;

  }

});
</script>

</body>
</html>
