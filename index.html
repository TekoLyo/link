<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Linksite de TekoLyo</title>

<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

<style>

body{
font-family: Arial, sans-serif;
margin:0;
display:flex;
justify-content:center;
align-items:center;
min-height:100vh;
background:linear-gradient(135deg,#ff7a18,#ffd200);
color:white;
text-align:center;
}

.card{
width:90%;
max-width:700px; /* plus large sur PC */
background:rgba(255,255,255,0.15);
padding:35px;
border-radius:25px;
backdrop-filter:blur(12px);
box-shadow:0 10px 30px rgba(0,0,0,0.2);
}

.profile{
width:130px;
height:130px;
border-radius:50%;
border:5px solid white;
margin-bottom:15px;
}

h1{
margin:10px 0;
}

p{
opacity:0.9;
margin-bottom:25px;
}

.link{
display:flex;
align-items:center;
gap:15px;
width:100%;
height:55px;
margin:10px 0;
padding-left:20px;
border-radius:14px;
color:white;
font-weight:bold;
text-decoration:none;
font-size:16px;
border:2px solid white;
transition:all 0.25s ease;
}

.link i{
width:30px;
font-size:20px;
text-align:center;
}

.link span{
flex:1;
text-align:left;
}

.link:hover{
transform:scale(1.04);
box-shadow:0 6px 18px rgba(0,0,0,0.3);
}

/* Couleurs réseaux */
.youtube{background:#FF0000;}
.tiktok{background:#000000;}
.twitch{background:#9146FF;}
.instagram{background:linear-gradient(45deg,#feda75,#d62976,#962fbf);}
.discord{background:#5865F2;}
.blog{background:#ff7a18;}
.github{background:#24292e;}

/* Responsive mobile */
@media (max-width:500px){
.card{
padding:25px;
}
.link{
height:50px;
font-size:15px;
}
}

/* Plus horizontal sur PC */
@media (min-width:700px){
.link{
height:60px;
font-size:18px;
padding-left:25px;
}
}

</style>
</head>

<body>

<div class="card">

<img src="logo.png" class="profile">

<h1>TekoLyo</h1>
<p>Petit créateur de contenu</p>

<a class="link youtube" href="https://www.youtube.com/@TekoLyo" target="_blank">
<i class="fab fa-youtube"></i>
<span>YouTube</span>
</a>

<a class="link tiktok" href="https://tiktok.com/@tekolyo" target="_blank">
<i class="fab fa-tiktok"></i>
<span>TikTok</span>
</a>

<a class="link twitch" href="https://twitch.tv/tekolyo" target="_blank">
<i class="fab fa-twitch"></i>
<span>Twitch</span>
</a>

<a class="link instagram" href="https://instagram.com/tekolyo" target="_blank">
<i class="fab fa-instagram"></i>
<span>Instagram</span>
</a>

<a class="link discord" href="https://discord.gg/AYFfKHQdDA" target="_blank">
<i class="fab fa-discord"></i>
<span>Discord</span>
</a>

<a class="link blog" href="https://blogdetekolyo.blogspot.com" target="_blank">
<i class="fas fa-blog"></i>
<span>Le Blog</span>
</a>

<a class="link github" href="https://github.com/TekoLyo/tekolyomod" target="_blank">
<i class="fab fa-github"></i>
<span>Mes Mods Minecraft</span>
</a>

</div>

</body>
</html>
