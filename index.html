<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Linksite de TekoLyo</title>

<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

<style>
body{
  font-family: Arial, sans-serif;
  margin:0;
  display:flex;
  justify-content:center;
  align-items:flex-start;
  min-height:100vh;
  background:linear-gradient(135deg,#ff7a18,#ffd200);
  color:white;
  text-align:center;
  padding-top:40px;
}

.card{
  background:rgba(255,255,255,0.15);
  padding:40px;
  border-radius:25px;
  backdrop-filter:blur(12px);
  box-shadow:0 10px 30px rgba(0,0,0,0.2);
  display:flex;
  flex-direction:column;
  align-items:center;
  gap:30px;
  max-width:1000px;
  width:90%;
}

.profile{
  width:180px;
  height:180px;
  border-radius:50%;
  border:5px solid white;
  margin-bottom:15px;
}

h1{
  margin:10px 0 5px 0;
  font-size:2em;
}

p{
  opacity:0.9;
  margin-bottom:20px;
  font-size:1.2em;
}

.links-container{
  display:flex;
  flex-wrap:wrap;
  gap:20px;
  justify-content:center;
  width:100%;
}

/* Boutons généraux */
.link{
  display:flex;
  align-items:center;
  justify-content:flex-start;
  gap:12px;
  padding:15px;
  border-radius:12px;
  color:white;
  font-weight:bold;
  text-decoration:none;
  font-size:16px;
  border:2px solid white;
  transition:all 0.25s ease;
  min-width:120px;
  box-sizing:border-box;
}

.link i{
  width:30px;
  text-align:center;
  font-size:20px;
}

.link span{
  flex:1;
  text-align:left;
}

.link:hover{
  transform:scale(1.05);
  box-shadow:0 6px 18px rgba(0,0,0,0.3);
}

/* Couleurs réseaux */
.youtube{background:#FF0000;}
.tiktok{background:#000000;}
.twitch{background:#9146FF;}
.instagram{background:linear-gradient(45deg,#feda75,#d62976,#962fbf);}
.discord{background:#5865F2;}
.blog{background:#ff7a18;}
.github{background:#24292e;}

/* PC : boutons carrés côte à côte */
@media (min-width:700px){
  .link{
    width:150px;
    height:150px;
    justify-content:center;
    flex-direction:column;
    font-size:16px;
  }
  .link i{
    font-size:32px;
    width:auto;
  }
  .link span{
    text-align:center;
  }
}

/* Mobile : boutons ajustés au texte */
@media (max-width:699px){
  .links-container{
    flex-direction:column;
    align-items:flex-start;
  }
  .link{
    width:auto;
    height:45px;
    font-size:15px;
    padding:0 15px;
  }
  .link i{
    font-size:18px;
  }
}
</style>
</head>

<body>

<div class="card">

<img src="logo.png" class="profile">

<h1>TekoLyo</h1>
<p>Petit créateur de contenu</p>

<div class="links-container">

<a class="link youtube" href="https://www.youtube.com/@TekoLyo" target="_blank">
<i class="fab fa-youtube"></i><span>YouTube</span>
</a>

<a class="link tiktok" href="https://tiktok.com/@tekolyo" target="_blank">
<i class="fab fa-tiktok"></i><span>TikTok</span>
</a>

<a class="link twitch" href="https://twitch.tv/tekolyo" target="_blank">
<i class="fab fa-twitch"></i><span>Twitch</span>
</a>

<a class="link instagram" href="https://instagram.com/tekolyo" target="_blank">
<i class="fab fa-instagram"></i><span>Instagram</span>
</a>

<a class="link discord" href="https://discord.gg/AYFfKHQdDA" target="_blank">
<i class="fab fa-discord"></i><span>Discord</span>
</a>

<a class="link blog" href="https://blogdetekolyo.blogspot.com" target="_blank">
<i class="fas fa-blog"></i><span>Le Blog</span>
</a>

<a class="link github" href="https://github.com/TekoLyo/tekolyomod" target="_blank">
<i class="fab fa-github"></i><span>Mes Mods Minecraft</span>
</a>

</div>
</div>

</body>
</html>
