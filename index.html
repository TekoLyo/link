<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>Linksite de TekoLyo</title>
    <style>
       body {
    font-family: Arial, sans-serif;
    background: linear-gradient(135deg, #ff7a18, #ffd200);
    color: white;
    text-align: center;
    padding: 40px;
}

        .card {
            max-width: 400px;
            margin: auto;
            background: rgba(255,255,255,0.15);
            padding: 30px;
            border-radius: 20px;
            backdrop-filter: blur(10px);
        }

        img {
            width: 120px;
            border-radius: 50%;
            margin-bottom: 15px;
        }

        h1 {
            margin-bottom: 5px;
        }

        p {
            opacity: 0.9;
        }

        a {
            display: block;
            margin: 15px 0;
            padding: 15px;
            background: white;
            color: #2575fc;
            text-decoration: none;
            border-radius: 12px;
            font-weight: bold;
            transition: transform 0.2s;
        }

        a:hover {
            transform: scale(1.05);
        }
    </style>
</head>
<body>

    <div class="card">
        <h1>Linksite de TekoLyo</h1>
        <p>Petit créateur de contenu </p>
