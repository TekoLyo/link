<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#e35337">
<title>TekoLyo · Link</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Russo+One&display=swap" rel="stylesheet">

<style>
:root {
  --accent: #e35337;
  --ink: #111827;
  --muted: #64748b;
  --card: #fff;
  --border: #e5e7eb;
  --shadow: 0 0 0 2px #111, 5px 5px 0 2px #111;
  --radius: 28px;
}

* {
  box-sizing: border-box;
}

body {
  margin: 0;
  min-height: 100vh;
  background: #fff1f5;
  color: #111;
  font-family: 'Russo One', system-ui, sans-serif;
}

a {
  color: inherit;
  text-decoration: none;
}

.page {
  max-width: 920px;
  margin: auto;
  padding: 48px 20px 30px;
}

.profile {
  text-align: center;
}

.avatar {
  width: 144px;
  height: 144px;
  object-fit: cover;
  border-radius: 50%;
  background: #ad1f28;
  box-shadow: 0 0 0 3px var(--accent);
}

h1 {
  font-size: clamp(1.8rem, 5vw, 2.5rem);
  margin: 18px 0 12px;
  display: flex;
  justify-content: center;
  align-items: center;
  gap: 9px;
  flex-wrap: wrap;
}

.bio {
  margin: 0 auto 24px;
  line-height: 1.7;
}

.socials {
  display: flex;
  justify-content: center;
  flex-wrap: wrap;
  gap: 10px;
  margin: 24px 0 26px;
}

.chip {
  display: inline-flex;
  align-items: center;
  gap: 8px;
  padding: 10px 14px;
  border-radius: 999px;
  background: #fff;
  border: 2px solid #111;
  box-shadow: 3px 3px 0 #111;
  transition: transform .15s, box-shadow .15s;
}

.chip:hover {
  transform: translate(2px, 2px);
  box-shadow: 1px 1px 0 #111;
}

.social-icon {
  width: 20px;
  height: 20px;
  display: block;
  flex: 0 0 20px;
}

.chip.youtube .social-icon {
  color: #ff0033;
}

.chip.tiktok .social-icon {
  color: #111;
}

.chip.twitch .social-icon {
  color: #9146ff;
}

.chip.instagram .social-icon {
  color: #d62976;
}

.chip.discord .social-icon {
  color: #5865f2;
}

.grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 20px;
}

.card {
  background: #fff;
  border: 2px solid #111;
  border-radius: var(--radius);
  box-shadow: var(--shadow);
  overflow: hidden;
}

.card-head {
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 18px;
}

.skin {
  width: 48px;
  height: 48px;
  image-rendering: pixelated;
  border-radius: 10px;
  background: #f1f5f9;
}

.small {
  font: 13px system-ui;
  color: var(--muted);
  margin-top: 4px;
}

.tag {
  font: 12px system-ui;
  border: 1px solid #111;
  border-radius: 999px;
  padding: 5px 8px;
  margin-left: auto;
  white-space: nowrap;
}

/* Logo Valorant */
.game-icon {
  width: 54px;
  height: 54px;
  flex-shrink: 0;
  border-radius: 12px;
  display: grid;
  place-items: center;
  background: #0f1923;
  overflow: hidden;
}

.game-icon img {
  width: 100%;
  height: 100%;
  object-fit: contain;
  display: block;
}

.stats {
  display: grid;
  grid-template-columns: 1fr 1fr;
  border-top: 1px solid var(--border);
}

.stat {
  text-align: center;
  padding: 14px 8px;
}

.stat + .stat {
  border-left: 1px solid var(--border);
}

.label {
  display: block;
  color: var(--muted);
  font: 11px system-ui;
  text-transform: uppercase;
  letter-spacing: .08em;
  margin-bottom: 5px;
}

.value {
  font-size: 16px;
}

.footer {
  text-align: center;
  margin-top: 34px;
  font: 12px system-ui;
  color: #64748b;
}

@media(max-width:640px) {
  .page {
    padding: 36px 16px 24px;
  }

  .grid {
    grid-template-columns: 1fr;
  }

  .avatar {
    width: 124px;
    height: 124px;
  }

  .tag {
    font-size: 11px;
  }
}
</style>
</head>

<body>
<main class="page">

<header class="profile">
  <img
    class="avatar"
    src="https://cdn.discordapp.com/avatars/972491118786793482/c9139ffcd618710c57e423c917222368.png?size=256"
    alt="Avatar de TekoLyo"
  >

  <h1>TekoLyo</h1>

  <p class="bio">
    <strong>Salut TekoLyo</strong><br>
    <strong>#M8</strong>
  </p>
</header>

<nav class="socials" aria-label="Réseaux sociaux">

    </svg>

    YouTube

      <path d="M19.6 6.2a5.8 5.8 0 0 1-3.5-1.2 5.8 5.8 0 0 1-1.8-3.1V1h-4v14.2a2.8 2.8 0 1 1-2-2.7v-4a6.8 6.8 0 1 0 6 6.7V8a9.7 9.7 0 0 0 5.7 1.8V5.9c-.1 0-.3 0-.4 0Z"/>
    </svg>

    TikTok
  </a>

  <a class="chip twitch"
     href="https://twitch.tv/tekolyo"
     target="_blank"
     rel="noopener noreferrer">

    <svg class="social-icon" viewBox="0 0 24 24" aria-hidden="true" fill="currentColor">
      <path d="M4 2 1.5 6v15h5v3h4l3-3h4l5-5V2H4Zm16 12-3 3h-5l-3 3v-3H5V4h15v10ZM12 7h2v6h-2V7Zm5 0h2v6h-2V7Z"/>

    Twitch
  </a>

  <a class="chip instagram"
     href="https://instagram.com/tekolyo"

     rel="noopener noreferrer">

      <rect x="3" y="3" width="18" height="18" rx="5"/>
      <circle cx="12" cy="12" r="4"/>
      <circle cx="17.6" cy="6.6" r="1" fill="currentColor" stroke="none"/>
    </svg>

    Instagram
  </a>

  <a class="chip discord"
     href="https://discord.gg/AYFfKHQdDA"
     target="_blank"
     rel="noopener noreferrer">

    <svg class="social-icon" viewBox="0 0 24 24" aria-hidden="true" fill="currentColor">
      <path d="M19.7 5.1A19 19 0 0 0 15 3.7l-.6 1.2a17 17 0 0 0-4.8 0L9 3.7a19 19 0 0 0-4.7 1.4C1.3 9.5.5 13.8.9 18a19 19 0 0 0 5.8 2.9l1.2-2a12 12 0 0 1-1.9-.9l.5-.4a13.5 13.5 0 0 0 11 0l.5.4a12 12 0 0 1-1.9.9l1.2 2a19 19 0 0 0 5.8-2.9c.5-4.9-.8-9.2-3.4-12.9ZM8.8 14.8c-1 0-1.8-.9-1.8-2s.8-2 1.8-2 1.8.9 1.8 2-.8 2-1.8 2Zm6.4 0c-1 0-1.8-.9-1.8-2s.8-2 1.8-2 1.8.9 1.8 2-.8 2-1.8 2Z"/>
    </svg>

    Discord
  </a>

</nav>

<section class="grid" aria-label="Profils de jeux">

  <!-- Minecraft -->
  <article class="card">

    <div class="card-head">

      <img
        class="skin"
        src="https://link.unclaim.fr/api/skin/TekoLyo?type=face&size=64"
        alt="Skin Minecraft de TekoLyo"
      >

      <div>
        <strong>TekoLyo</strong>
        <div class="small">▦ Minecraft</div>
      </div>

      <span class="tag">Java / Bedrock</span>

    </div>

  </article>

  <!-- Valorant -->
  <article class="card">

    <div class="card-head">

      <div class="game-icon">
        <img src="valorant.png" alt="Logo Valorant">
      </div>

      <div>
        <span
          class="tag"
          style="margin:0;background:#ff465522;color:#ff4655"
        >
          ● Valorant
        </span>

        <div style="margin-top:7px">
          <strong>TekoLyo</strong>
        </div>
      </div>

    </div>

    <div class="stats">

      <div class="stat">
        <span class="label">Agent préféré</span>
        <span class="value">Omen</span>
      </div>

      <div class="stat">
        <span class="label">Rang</span>
        <span class="value">Iron I</span>
      </div>

    </div>

  </article>

</section>

<footer class="footer">
  Page personnelle de TekoLyo
</footer>

</main>
</body>
</html>
