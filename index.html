:root{--accent:#e35337;--ink:#111827;--muted:#64748b;--card:#fff;--border:#e5e7eb;--shadow:0 0 0 2px #111,5px 5px 0 2px #111;--radius:28px}
*{box-sizing:border-box}body{margin:0;min-height:100vh;background:#fff1f5;color:#111;font-family:'Teko',system-ui,sans-serif}a{color:inherit;text-decoration:none}.page{max-width:920px;margin:auto;padding:48px 20px 30px}.profile{text-align:center}.avatar{width:144px;height:144px;object-fit:cover;border-radius:50%;background:#ad1f28;box-shadow:0 0 0 3px var(--accent)}h1{font-size:clamp(1.8rem,5vw,2.5rem);margin:18px 0 12px;display:flex;justify-content:center;align-items:center;gap:9px;flex-wrap:wrap}.bio{margin:0 auto 24px;line-height:1.7}.socials{display:flex;justify-content:center;flex-wrap:wrap;gap:10px;margin:24px 0 26px}.chip{display:inline-flex;align-items:center;gap:8px;padding:10px 14px;border-radius:999px;background:#fff;border:2px solid #111;box-shadow:3px 3px 0 #111;transition:transform .15s,box-shadow .15s}.chip:hover{transform:translate(2px,2px);box-shadow:1px 1px 0 #111}.social-icon{width:20px;height:20px;display:block;flex:0 0 20px}.chip.youtube .social-icon{color:#ff0033}.chip.tiktok .social-icon{color:#111}.chip.twitch .social-icon{color:#9146ff}.chip.instagram .social-icon{color:#d62976}.chip.discord .social-icon{color:#5865f2}.grid{display:grid;grid-template-columns:1fr 1fr;gap:20px}.card{background:#fff;border:2px solid #111;border-radius:var(--radius);box-shadow:var(--shadow);overflow:hidden}.card-head{display:flex;align-items:center;gap:12px;padding:18px}.skin{width:48px;height:48px;image-rendering:pixelated;border-radius:10px;background:#f1f5f9}.small{font:13px system-ui;color:var(--muted);margin-top:4px}.tag{font:12px system-ui;border:1px solid #111;border-radius:999px;padding:5px 8px;margin-left:auto;white-space:nowrap}.game-icon{width:54px;height:54px;border-radius:12px;display:grid;place-items:center;background:#ff465526;color:#ff4655;flex:0 0 54px}.valorant-logo{width:54px;height:54px;display:block;object-fit:cover;border-radius:12px}.stats{display:grid;grid-template-columns:1fr 1fr;border-top:1px solid var(--border)}.stat{text-align:center;padding:14px 8px}.stat+ .stat{border-left:1px solid var(--border)}.label{display:block;color:var(--muted);font:11px system-ui;text-transform:uppercase;letter-spacing:.08em;margin-bottom:5px}.value{font-size:16px}.footer{text-align:center;margin-top:34px;font:12px system-ui;color:#64748b}
@media(max-width:640px){.page{padding:36px 16px 24px}.grid{grid-template-columns:1fr}.avatar{width:124px;height:124px}.tag{font-size:11px}}
/* Adaptation mobile */
@media (max-width: 480px){
  .page{width:100%;padding:28px 14px 22px}
  .avatar{width:108px;height:108px}
  h1{font-size:clamp(2rem,9vw,2.5rem);margin:15px 0 8px;gap:6px}
  .bio{font-size:16px;line-height:1.45;max-width:30ch;margin-bottom:18px}
  .socials{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin:20px 0 24px}
  .chip{min-width:0;justify-content:center;padding:10px 8px;font-size:16px;gap:7px;box-shadow:2px 2px 0 #111}
  .social-icon{width:19px;height:19px;flex-basis:19px}
  .grid{gap:16px}
  .card{border-radius:22px;box-shadow:0 0 0 1px #111,3px 3px 0 1px #111}
  .card-head{padding:15px;gap:10px;min-width:0}
  .card-head>div{min-width:0}
  .skin,.game-icon,.valorant-logo{width:46px;height:46px;flex:0 0 46px}
  .tag{margin-left:auto;padding:4px 6px;white-space:normal;text-align:center;max-width:100px}
  .stats .stat{padding:12px 6px}
  .label{font-size:10px;letter-spacing:.04em}
  .value{font-size:18px}
  .footer{margin-top:26px;font-size:12px}
}
@media (max-width:340px){
  .page{padding-left:10px;padding-right:10px}
  .socials{grid-template-columns:1fr}
  .chip{justify-content:flex-start;padding-left:18px}
  .card-head{padding:12px;gap:8px}
  .tag{font-size:10px;max-width:78px}
}
</style>
